<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             minimum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">

<title>Salvadanaio</title>


<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    color: #111111;

    overscroll-behavior: none;
}


/* =====================================================
   APP
===================================================== */

.app {

    width: 100%;
    height: 100dvh;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        calc(24px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));

    -webkit-overflow-scrolling: touch;

    overscroll-behavior-y: contain;
}

.app::-webkit-scrollbar {
    display: none;
}


/* =====================================================
   TITOLO
===================================================== */

.title {

    text-align: center;

    margin: 0 0 28px 0;

    font-size: 32px;

    font-weight: 750;

    letter-spacing: -1px;
}


/* =====================================================
   RIGA
===================================================== */

.row {

    width: 100%;

    min-height: 115px;

    display: flex;

    align-items: center;

    gap: 14px;

    margin-bottom: 14px;

    padding: 10px 12px;

    background: #ffffff;

    border-radius: 20px;

    border: 1px solid #eeeeee;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.05);
}


/* =====================================================
   IMMAGINE
===================================================== */

.money-image {

    width: 135px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* =====================================================
   BANCONOTA
===================================================== */

.banknote {

    position: relative;

    width: 130px;

    height: 68px;

    border-radius: 7px;

    overflow: hidden;

    box-shadow:
        0 2px 5px rgba(0,0,0,.20);

    border: 1px solid rgba(0,0,0,.18);

    display: flex;

    align-items: center;

    justify-content: center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-weight: bold;

    color: rgba(255,255,255,.92);

}


/* decorazione banconota */

.banknote::before {

    content: "";

    position: absolute;

    inset: 7px;

    border: 1px solid rgba(255,255,255,.55);

    border-radius: 4px;

}


.banknote::after {

    content: "";

    position: absolute;

    width: 34px;

    height: 34px;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.42);

    left: 10px;

    top: 16px;

}


/* =====================================================
   NUMERO BANCONOTA
===================================================== */

.banknote-number {

    position: relative;

    z-index: 2;

    font-size: 30px;

    text-shadow:
        0 1px 2px rgba(0,0,0,.25);

}


/* =====================================================
   COLORI BANCONOTE
===================================================== */

.note-20 {

    background:
        linear-gradient(
            135deg,
            #b85b69,
            #d48a91
        );

}


.note-50 {

    background:
        linear-gradient(
            135deg,
            #c47a28,
            #e0a55e
        );

}


.note-100 {

    background:
        linear-gradient(
            135deg,
            #4b8d73,
            #74b69c
        );

}


/* =====================================================
   €2
===================================================== */

.coin-2 {

    width: 72px;

    height: 72px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f5e7a2,
            #d5b951 55%,
            #b6972e 100%
        );

    border: 3px solid #c2a83e;

    box-shadow:
        0 2px 5px rgba(0,0,0,.22);

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 25px;

    font-weight: bold;

    color: #665417;
}


.coin-2::before {

    content: "";

    position: absolute;

    inset: 7px;

    border: 1px solid rgba(90,70,10,.45);

    border-radius: 50%;

}


/* =====================================================
   CONTATORE
===================================================== */

.counter-area {

    flex: 1;

    min-width: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 9px;
}


/* =====================================================
   PULSANTI + E -
===================================================== */

.counter-button {

    width: 43px;

    height: 43px;

    flex-shrink: 0;

    border: none;

    border-radius: 13px;

    background: #f0f0f2;

    color: #111111;

    font-size: 27px;

    font-weight: 400;

    line-height: 43px;

    text-align: center;

    padding: 0;

    cursor: pointer;

    touch-action: manipulation;

}


.counter-button:active {

    transform: scale(.91);

    background: #e4e4e7;

}


/* =====================================================
   NUMERO CENTRALE
===================================================== */

.number {

    min-width: 54px;

    padding: 5px 2px;

    text-align: center;

    font-size: 25px;

    font-weight: 650;

    border-radius: 10px;

    cursor: text;

    outline: none;

    user-select: text;

    -webkit-user-select: text;

}


/* quando viene modificato */

.number.editing {

    background: #f0f0f2;

}


/* =====================================================
   NUMERO BANCONOTE
===================================================== */

.note-count {

    width: 48px;

    flex-shrink: 0;

    text-align: center;

    font-size: 15px;

    font-weight: 600;

    color: #555555;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 430px) {

    .app {

        padding-left: 10px;
        padding-right: 10px;

    }


    .row {

        gap: 8px;

        padding:
            9px 7px;

    }


    .money-image {

        width: 116px;

    }


    .banknote {

        width: 112px;

        height: 59px;

    }


    .banknote-number {

        font-size: 27px;

    }


    .coin-2 {

        width: 65px;
        height: 65px;

        font-size: 23px;

    }


    .counter-button {

        width: 40px;
        height: 40px;

        line-height: 40px;

    }


    .number {

        min-width: 45px;

        font-size: 23px;

    }


    .note-count {

        width: 39px;

        font-size: 14px;

    }

}


/* =====================================================
   SCHERMI MOLTO PICCOLI
===================================================== */

@media (max-width: 360px) {

    .money-image {

        width: 102px;

    }


    .banknote {

        width: 98px;

        height: 53px;

    }


    .counter-area {

        gap: 4px;

    }


    .counter-button {

        width: 36px;
        height: 36px;

        line-height: 36px;

    }


    .number {

        min-width: 38px;

        font-size: 21px;

    }


    .note-count {

        width: 34px;

        font-size: 13px;

    }

}

</style>

</head>


<body>


<div class="app">


    <h1 class="title">
        Salvadanaio
    </h1>


    <!-- =================================================
         €2
    ================================================== -->

    <div class="row">


        <div class="money-image">

            <div class="coin-2">

                €2

            </div>

        </div>


        <div class="counter-area">


            <button
                class="counter-button"
                onclick="changeValue('two', -1)"
            >
                −
            </button>


            <div
                class="number"
                id="number-two"
                contenteditable="true"
                inputmode="numeric"
                onfocus="startEditing(this)"
                onblur="finishEditing('two', this)"
                onkeydown="handleEnter(event, this, 'two')"
            >
                0
            </div>


            <button
                class="counter-button"
                onclick="changeValue('two', 1)"
            >
                +
            </button>


        </div>


        <div
            class="note-count"
            id="count-two"
        >
            0
        </div>


    </div>



    <!-- =================================================
         €20
    ================================================== -->

    <div class="row">


        <div class="money-image">

            <div class="banknote note-20">

                <span class="banknote-number">
                    20
                </span>

            </div>

        </div>


        <div class="counter-area">


            <button
                class="counter-button"
                onclick="changeValue('twenty', -1)"
            >
                −
            </button>


            <div
                class="number"
                id="number-twenty"
                contenteditable="true"
                inputmode="numeric"
                onfocus="startEditing(this)"
                onblur="finishEditing('twenty', this)"
                onkeydown="handleEnter(event, this, 'twenty')"
            >
                0
            </div>


            <button
                class="counter-button"
                onclick="changeValue('twenty', 1)"
            >
                +
            </button>


        </div>


        <div
            class="note-count"
            id="count-twenty"
        >
            0
        </div>


    </div>



    <!-- =================================================
         €50
    ================================================== -->

    <div class="row">


        <div class="money-image">

            <div class="banknote note-50">

                <span class="banknote-number">
                    50
                </span>

            </div>

        </div>


        <div class="counter-area">


            <button
                class="counter-button"
                onclick="changeValue('fifty', -1)"
            >
                −
            </button>


            <div
                class="number"
                id="number-fifty"
                contenteditable="true"
                inputmode="numeric"
                onfocus="startEditing(this)"
                onblur="finishEditing('fifty', this)"
                onkeydown="handleEnter(event, this, 'fifty')"
            >
                0
            </div>


            <button
                class="counter-button"
                onclick="changeValue('fifty', 1)"
            >
                +
            </button>


        </div>


        <div
            class="note-count"
            id="count-fifty"
        >
            0
        </div>


    </div>



    <!-- =================================================
         €100
    ================================================== -->

    <div class="row">


        <div class="money-image">

            <div class="banknote note-100">

                <span class="banknote-number">
                    100
                </span>

            </div>

        </div>


        <div class="counter-area">


            <button
                class="counter-button"
                onclick="changeValue('hundred', -1)"
            >
                −
            </button>


            <div
                class="number"
                id="number-hundred"
                contenteditable="true"
                inputmode="numeric"
                onfocus="startEditing(this)"
                onblur="finishEditing('hundred', this)"
                onkeydown="handleEnter(event, this, 'hundred')"
            >
                0
            </div>


            <button
                class="counter-button"
                onclick="changeValue('hundred', 1)"
            >
                +
            </button>


        </div>


        <div
            class="note-count"
            id="count-hundred"
        >
            0
        </div>


    </div>


</div>



<script>

/* =====================================================
   DATI
===================================================== */

const STORAGE_KEY =
    "salvadanaio_v1";


let values = {

    two: 0,

    twenty: 0,

    fifty: 0,

    hundred: 0

};


/* =====================================================
   CARICA DATI
===================================================== */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        return;

    }


    try {

        const parsed =
            JSON.parse(saved);


        values = {

            two:
                Math.max(
                    0,
                    Number(parsed.two) || 0
                ),

            twenty:
                Math.max(
                    0,
                    Number(parsed.twenty) || 0
                ),

            fifty:
                Math.max(
                    0,
                    Number(parsed.fifty) || 0
                ),

            hundred:
                Math.max(
                    0,
                    Number(parsed.hundred) || 0
                )

        };

    }

    catch (error) {

        console.log(
            "Errore caricamento dati"
        );

    }

}


/* =====================================================
   SALVA DATI
===================================================== */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(values)
    );

}


/* =====================================================
   AGGIORNA SCHERMATA
===================================================== */

function updateScreen(
    type
) {

    const number =
        document.getElementById(
            "number-" + type
        );


    const count =
        document.getElementById(
            "count-" + type
        );


    number.textContent =
        values[type];


    count.textContent =
        values[type];

}


/* =====================================================
   AGGIORNA TUTTO
===================================================== */

function updateAll() {

    updateScreen("two");

    updateScreen("twenty");

    updateScreen("fifty");

    updateScreen("hundred");

}


/* =====================================================
   + E -
===================================================== */

function changeValue(
    type,
    amount
) {

    let newValue =
        values[type] + amount;


    if (newValue < 0) {

        newValue = 0;

    }


    values[type] =
        newValue;


    saveData();

    updateScreen(type);

}


/* =====================================================
   MODIFICA MANUALE
===================================================== */

function startEditing(
    element
) {

    element.classList.add(
        "editing"
    );


    /*
       Seleziona il contenuto
       quando viene toccato.
    */

    const range =
        document.createRange();


    range.selectNodeContents(
        element
    );


    const selection =
        window.getSelection();


    selection.removeAllRanges();

    selection.addRange(
        range
    );

}


/* =====================================================
   FINE MODIFICA
===================================================== */

function finishEditing(
    type,
    element
) {

    element.classList.remove(
        "editing"
    );


    let value =
        element.textContent
        .replace(/\D/g, "");


    if (value === "") {

        value = "0";

    }


    let number =
        parseInt(
            value,
            10
        );


    if (
        isNaN(number) ||
        number < 0
    ) {

        number = 0;

    }


    values[type] =
        number;


    saveData();

    updateScreen(type);

}


/* =====================================================
   INVIO DA TASTIERA
===================================================== */

function handleEnter(
    event,
    element,
    type
) {

    /*
       Evita di creare
       una nuova riga.
    */

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        element.blur();

    }

}


/* =====================================================
   BLOCCO ZOOM IPHONE / IPAD
===================================================== */

document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =====================================================
   BLOCCO ZOOM CTRL + ROTELLA
===================================================== */

document.addEventListener(
    "wheel",
    function(event) {

        if (event.ctrlKey) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   BLOCCO CTRL + / - / 0
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            (
                event.key === "+" ||
                event.key === "-" ||
                event.key === "0"
            )
        ) {

            event.preventDefault();

        }

    }
);


/* =====================================================
   AVVIO
===================================================== */

loadData();

updateAll();

</script>


</body>

</html>
