<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             minimum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">

<title>SALVADANAIO</title>


<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;
}


html,
body {

    width: 100%;

    height: 100%;

    margin: 0;

    padding: 0;

    overflow: hidden;

    background: #ffffff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;

    color: #111111;

    overscroll-behavior: none;

}


/* =====================================================
   APP
===================================================== */

.app {

    width: 100%;

    height: 100dvh;

    overflow-y: auto;

    overflow-x: hidden;

    padding:
        calc(18px + env(safe-area-inset-top))
        12px
        calc(14px + env(safe-area-inset-bottom));

    -webkit-overflow-scrolling: touch;

    overscroll-behavior-y: contain;

}


.app::-webkit-scrollbar {

    display: none;

}


/* =====================================================
   RESET
===================================================== */

.reset-container {

    width: 100%;

    height: 30px;

    display: flex;

    justify-content: flex-end;

    align-items: center;

    margin-bottom: 4px;

}


.reset-button {

    border: none;

    background: #f0f0f2;

    color: #555555;

    border-radius: 10px;

    padding: 7px 10px;

    font-size: 11px;

    font-weight: 700;

    cursor: pointer;

}


.reset-button:active {

    transform: scale(.92);

}


/* =====================================================
   COUNTER TOTALE
===================================================== */

.total-box {

    width: 100%;

    text-align: center;

    margin-bottom: 16px;

}


.total-label {

    font-size: 14px;

    font-weight: 600;

    color: #777777;

    margin-bottom: 2px;

}


.total-value {

    font-size: 46px;

    line-height: 1.05;

    font-weight: 750;

    letter-spacing: -2px;

    color: #111111;

}


/* =====================================================
   RIGA
===================================================== */

.row {

    width: 100%;

    min-height: 98px;

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 9px;

    padding: 7px 9px;

    background: #ffffff;

    border-radius: 18px;

    border: 1px solid #eeeeee;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.05);

}


/* =====================================================
   IMMAGINE
===================================================== */

.money-image {

    width: 118px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =====================================================
   IMMAGINE REALE
===================================================== */

.money-image img {

    display: block;

    max-width: 100%;

    object-fit: contain;

    user-select: none;

    -webkit-user-select: none;

    pointer-events: none;

}


/* =====================================================
   BANCONOTE
===================================================== */

.banknote-image {

    width: 114px;

    height: auto;

    border-radius: 5px;

    box-shadow:
        0 2px 6px rgba(0,0,0,.20);

}


/* =====================================================
   MONETA €2
===================================================== */

.coin-image {

    width: 66px;

    height: 66px;

    border-radius: 50%;

    object-fit: cover;

    box-shadow:
        0 2px 6px rgba(0,0,0,.20);

}


/* =====================================================
   CONTATORE
===================================================== */

.counter-area {

    flex: 1;

    min-width: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

}


/* =====================================================
   PULSANTI
===================================================== */

.counter-button {

    width: 40px;

    height: 40px;

    flex-shrink: 0;

    border: none;

    border-radius: 12px;

    background: #f0f0f2;

    color: #111111;

    font-size: 25px;

    font-weight: 400;

    line-height: 40px;

    text-align: center;

    padding: 0;

    cursor: pointer;

    touch-action: manipulation;

}


.counter-button:active {

    transform: scale(.91);

    background: #e4e4e7;

}


/* =====================================================
   NUMERO CENTRALE
===================================================== */

.number {

    min-width: 48px;

    padding: 4px 2px;

    text-align: center;

    font-size: 23px;

    font-weight: 650;

    border-radius: 9px;

    cursor: text;

    outline: none;

    user-select: text;

    -webkit-user-select: text;

}


.number.editing {

    background: #f0f0f2;

}


/* =====================================================
   NUMERO PEZZI
===================================================== */

.note-count {

    width: 38px;

    flex-shrink: 0;

    text-align: center;

    font-size: 14px;

    font-weight: 600;

    color: #555555;

}


/* =====================================================
   SCHERMI PICCOLI
===================================================== */

@media (max-width: 380px) {

    .money-image {

        width: 104px;

    }


    .banknote-image {

        width: 100px;

    }


    .coin-image {

        width: 60px;

        height: 60px;

    }


    .counter-area {

        gap: 5px;

    }


    .counter-button {

        width: 36px;

        height: 36px;

        line-height: 36px;

        font-size: 23px;

    }


    .number {

        min-width: 42px;

        font-size: 21px;

    }


    .note-count {

        width: 32px;

        font-size: 13px;

    }

}


/* =====================================================
   SCHERMI BASSI
===================================================== */

@media (max-height: 700px) {

    .app {

        padding-top:
            calc(12px + env(safe-area-inset-top));

        padding-bottom:
            calc(10px + env(safe-area-inset-bottom));

    }


    .reset-container {

        height: 28px;

        margin-bottom: 2px;

    }


    .total-box {

        margin-bottom: 10px;

    }


    .total-value {

        font-size: 42px;

    }


    .row {

        min-height: 88px;

        margin-bottom: 6px;

        padding: 6px 8px;

    }


    .banknote-image {

        width: 104px;

    }


    .money-image {

        width: 108px;

    }


    .coin-image {

        width: 60px;

        height: 60px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =================================================
         RESET
    ================================================== -->

    <div class="reset-container">

        <button
            class="reset-button"
            onclick="resetAll()"
        >
            RESET
        </button>

    </div>


    <!-- =================================================
         COUNTER TOTALE
    ================================================== -->

    <div class="total-box">


        <div class="total-label">
            Totale
        </div>


        <div
            class="total-value"
            id="totalValue"
        >
            €0
        </div>


    </div>


    <!-- =================================================
         €2
    ================================================== -->

    <div class="row">


        <div class="money-image">

            <img
                src="2-euro.jpg"
                class="coin-image"
                alt="Moneta da 2 euro"
            >

        </div>


        <div class="counter-area">


            <button
                class="counter-button"
                onclick="changeValue('two', -1)"
            >
                −
            </button>


            <div
                class="number"
                id="number-two"
                contenteditable="true"
                inputmode="numeric"
                onfocus="startEditing(this)"
                onblur="finishEditing('two', this)"
                onkeydown="handleEnter(event, this)"
            >
                0
            </div>


            <button
                class="counter-button"
                onclick="changeValue('two', 1)"
            >
                +
            </button>


        </div>


        <div
            class="note-count"
            id="count-two"
        >
            0
        </div>


    </div>


    <!-- =================================================
         €10
    ================================================== -->

    <div class="row">


        <div class="money-image">

            <img
                src="10-euro.jpg"
                class="banknote-image"
                alt="Banconota da 10 euro"
            >

        </div>


        <div class="counter-area">


            <button
                class="counter-button"
                onclick="changeValue('ten', -1)"
            >
                −
            </button>


            <div
                class="number"
                id="number-ten"
                contenteditable="true"
                inputmode="numeric"
                onfocus="startEditing(this)"
                onblur="finishEditing('ten', this)"
                onkeydown="handleEnter(event, this)"
            >
                0
            </div>


            <button
                class="counter-button"
                onclick="changeValue('ten', 1)"
            >
                +
            </button>


        </div>


        <div
            class="note-count"
            id="count-ten"
        >
            0
        </div>


    </div>


    <!-- =================================================
         €20
    ================================================== -->

    <div class="row">


        <div class="money-image">

            <img
                src="20-euro.jpg"
                class="banknote-image"
                alt="Banconota da 20 euro"
            >

        </div>


        <div class="counter-area">


            <button
                class="counter-button"
                onclick="changeValue('twenty', -1)"
            >
                −
            </button>


            <div
                class="number"
                id="number-twenty"
                contenteditable="true"
                inputmode="numeric"
                onfocus="startEditing(this)"
                onblur="finishEditing('twenty', this)"
                onkeydown="handleEnter(event, this)"
            >
                0
            </div>


            <button
                class="counter-button"
                onclick="changeValue('twenty', 1)"
            >
                +
            </button>


        </div>


        <div
            class="note-count"
            id="count-twenty"
        >
            0
        </div>


    </div>


    <!-- =================================================
         €50
    ================================================== -->

    <div class="row">


        <div class="money-image">

            <img
                src="50-euro.jpg"
                class="banknote-image"
                alt="Banconota da 50 euro"
            >

        </div>


        <div class="counter-area">


            <button
                class="counter-button"
                onclick="changeValue('fifty', -1)"
            >
                −
            </button>


            <div
                class="number"
                id="number-fifty"
                contenteditable="true"
                inputmode="numeric"
                onfocus="startEditing(this)"
                onblur="finishEditing('fifty', this)"
                onkeydown="handleEnter(event, this)"
            >
                0
            </div>


            <button
                class="counter-button"
                onclick="changeValue('fifty', 1)"
            >
                +
            </button>


        </div>


        <div
            class="note-count"
            id="count-fifty"
        >
            0
        </div>


    </div>


    <!-- =================================================
         €100
    ================================================== -->

    <div class="row">


        <div class="money-image">

            <img
                src="100-euro.jpg"
                class="banknote-image"
                alt="Banconota da 100 euro"
            >

        </div>


        <div class="counter-area">


            <button
                class="counter-button"
                onclick="changeValue('hundred', -1)"
            >
                −
            </button>


            <div
                class="number"
                id="number-hundred"
                contenteditable="true"
                inputmode="numeric"
                onfocus="startEditing(this)"
                onblur="finishEditing('hundred', this)"
                onkeydown="handleEnter(event, this)"
            >
                0
            </div>


            <button
                class="counter-button"
                onclick="changeValue('hundred', 1)"
            >
                +
            </button>


        </div>


        <div
            class="note-count"
            id="count-hundred"
        >
            0
        </div>


    </div>


</div>



<script>

/* =====================================================
   DATI
===================================================== */

const STORAGE_KEY =
    "salvadanaio_v1";


let values = {

    two: 0,

    ten: 0,

    twenty: 0,

    fifty: 0,

    hundred: 0

};


/* =====================================================
   VALORE DELLE DENOMINAZIONI
===================================================== */

const denominations = {

    two: 2,

    ten: 10,

    twenty: 20,

    fifty: 50,

    hundred: 100

};


/* =====================================================
   CARICA DATI
===================================================== */

function loadData() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (!saved) {

        return;

    }


    try {

        const parsed =
            JSON.parse(saved);


        values = {

            two:
                Math.max(
                    0,
                    Number(parsed.two) || 0
                ),

            ten:
                Math.max(
                    0,
                    Number(parsed.ten) || 0
                ),

            twenty:
                Math.max(
                    0,
                    Number(parsed.twenty) || 0
                ),

            fifty:
                Math.max(
                    0,
                    Number(parsed.fifty) || 0
                ),

            hundred:
                Math.max(
                    0,
                    Number(parsed.hundred) || 0
                )

        };

    }

    catch (error) {

        console.log(
            "Errore caricamento dati"
        );

    }

}


/* =====================================================
   SALVA DATI
===================================================== */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(values)
    );

}


/* =====================================================
   CALCOLO TOTALE
===================================================== */

function calculateTotal() {

    return (

        values.two *
        denominations.two +

        values.ten *
        denominations.ten +

        values.twenty *
        denominations.twenty +

        values.fifty *
        denominations.fifty +

        values.hundred *
        denominations.hundred

    );

}


/* =====================================================
   AGGIORNA TOTALE
===================================================== */

function updateTotal() {

    const total =
        calculateTotal();


    document.getElementById(
        "totalValue"
    ).textContent =
        "€" +
        total.toLocaleString(
            "it-IT"
        );

}


/* =====================================================
   AGGIORNA SCHERMATA
===================================================== */

function updateScreen(
    type
) {

    const number =
        document.getElementById(
            "number-" + type
        );


    const count =
        document.getElementById(
            "count-" + type
        );


    number.textContent =
        values[type];


    count.textContent =
        values[type];


    updateTotal();

}


/* =====================================================
   AGGIORNA TUTTO
===================================================== */

function updateAll() {

    updateScreen("two");

    updateScreen("ten");

    updateScreen("twenty");

    updateScreen("fifty");

    updateScreen("hundred");

    updateTotal();

}


/* =====================================================
   + E -
===================================================== */

function changeValue(
    type,
    amount
) {

    let newValue =
        values[type] + amount;


    if (newValue < 0) {

        newValue = 0;

    }


    values[type] =
        newValue;


    saveData();

    updateScreen(type);

}


/* =====================================================
   MODIFICA MANUALE
===================================================== */

function startEditing(
    element
) {

    element.classList.add(
        "editing"
    );


    const range =
        document.createRange();


    range.selectNodeContents(
        element
    );


    const selection =
        window.getSelection();


    selection.removeAllRanges();

    selection.addRange(
        range
    );

}


/* =====================================================
   FINE MODIFICA
===================================================== */

function finishEditing(
    type,
    element
) {

    element.classList.remove(
        "editing"
    );


    let value =
        element.textContent
        .replace(/\D/g, "");


    if (value === "") {

        value = "0";

    }


    let number =
        parseInt(
            value,
            10
        );


    if (
        isNaN(number) ||
        number < 0
    ) {

        number = 0;

    }


    values[type] =
        number;


    saveData();

    updateScreen(type);

}


/* =====================================================
   INVIO DA TASTIERA
===================================================== */

function handleEnter(
    event,
    element
) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        element.blur();

    }

}


/* =====================================================
   RESET COMPLETO
===================================================== */

function resetAll() {

    const confirmation =
        confirm(
            "Vuoi davvero azzerare tutti i valori del salvadanaio?"
        );


    if (!confirmation) {

        return;

    }


    values = {

        two: 0,

        ten: 0,

        twenty: 0,

        fifty: 0,

        hundred: 0

    };


    saveData();

    updateAll();

}


/* =====================================================
   BLOCCO ZOOM IPHONE / IPAD
===================================================== */

document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gesturechange",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


document.addEventListener(
    "gestureend",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =====================================================
   BLOCCO ZOOM CTRL + ROTELLA
===================================================== */

document.addEventListener(
    "wheel",
    function(event) {

        if (event.ctrlKey) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* =====================================================
   BLOCCO CTRL + / - / 0
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            (
                event.key === "+" ||
                event.key === "-" ||
                event.key === "0"
            )
        ) {

            event.preventDefault();

        }

    }
);


/* =====================================================
   AVVIO
===================================================== */

loadData();

updateAll();

</script>


</body>

</html>
